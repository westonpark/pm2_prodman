# prodman: build the standalone pm2 binary (packager/binary) for every platform whenever pm2
# changes on master, smoke test it, and publish it to the GitHub release v<package version>
# (created on the first build of a version, its assets replaced on later builds) as the latest
# release, which install.sh and the agent's self-update download from.
name: pm2 binary

on:
  push:
    branches: [master]
    paths:
      - 'bin/**'
      - 'lib/**'
      - 'modules/**'
      - 'constants.js'
      - 'paths.js'
      - 'index.js'
      - 'package.json'
      - 'packager/binary/**'
      - '.github/workflows/binary.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pm2-binary
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Build binaries
        run: bun packager/binary/build.js --all

      - name: Smoke test (linux-x64)
        run: packager/binary/smoke.sh dist/binary/pm2-linux-x64

      - name: Smoke test (linux-x64-musl, Alpine)
        run: docker run --rm -v "$PWD:/w" -w /w node:24-alpine sh -c 'apk add -q bash && packager/binary/smoke.sh dist/binary/pm2-linux-x64-musl'

      - uses: actions/upload-artifact@v4
        with:
          name: pm2-binaries
          path: |
            dist/binary/pm2-*
            dist/binary/SHA256SUMS
          retention-days: 14

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          cp packager/binary/install.sh dist/binary/install.sh
          cat > notes.md <<EOF
          pm2_prodman $VERSION, built from ${GITHUB_SHA::12}.

          Standalone pm2 binary: the CLI runs on its embedded bun, the daemon and apps on the node on the PATH (or PM2_NODE).

          \`\`\`
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh
          \`\`\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/binary/pm2-* dist/binary/SHA256SUMS dist/binary/install.sh --clobber
            gh release edit "$TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" dist/binary/pm2-* dist/binary/SHA256SUMS dist/binary/install.sh \
              --target "$GITHUB_SHA" --title "pm2_prodman $VERSION" --notes-file notes.md --latest
          fi
